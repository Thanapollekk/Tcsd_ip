<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลอุปกรณ์และเครือข่ายของคุณ</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 30px; 
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #2c3e50; }
        .info-box, .form-box {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            line-height: 1.6;
        }
        .info-label { font-weight: bold; color: #495057; display: inline-block; width: 120px; }
        
        /* สไตล์สำหรับช่องกรอกข้อมูลและปุ่ม */
        input[type="text"], input[type="email"], input[type="tel"] {
            width: calc(100% - 130px);
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .save-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .save-btn:hover { background-color: #0056b3; }

        #status { text-align: center; font-weight: bold; margin-top: 15px; color: blue; }
        .success { color: #28a745 !important; }
        .error { color: #dc3545 !important; }
    </style>
</head>
<body>

    <div class="container">
        <h2>ตรวจสอบข้อมูลระบบของคุณ</h2>
        
        <!-- ส่วนแสดงข้อมูลเครื่องอัตโนมัติ -->
        <div class="info-box">
            <p><span class="info-label">🌐 IP Address:</span> <span id="ipDisplay">กำลังตรวจสอบ...</span></p>
            <p><span class="info-label">💻 OS:</span> <span id="osDisplay">กำลังตรวจสอบ...</span></p>
            <p><span class="info-label">📱 เบราว์เซอร์:</span> <span id="deviceDisplay">กำลังตรวจสอบ...</span></p>
        </div>

        <!-- ส่วนฟอร์มให้ผู้ใช้กรอกข้อมูลส่วนตัว -->
        <div class="form-box">
            <h3>ข้อมูลส่วนตัว</h3>
            <div>
                <span class="info-label">👤 ชื่อบัญชี:</span>
                <input type="text" id="nameInput" placeholder="กรอกชื่อของคุณ">
            </div>
            <div>
                <span class="info-label">📧 อีเมล:</span>
                <input type="email" id="emailInput" placeholder="กรอกอีเมล">
            </div>
            <div>
                <span class="info-label">📱 เบอร์โทร:</span>
                <input type="tel" id="phoneInput" placeholder="กรอกเบอร์โทรศัพท์">
            </div>
            <button id="saveBtn" class="save-btn">บันทึกข้อมูลเข้าสู่ระบบ</button>
        </div>

        <p id="status">กำลังเตรียมพร้อม...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        // Config ของ Firebase 
        const firebaseConfig = {
            apiKey: "AIzaSyAv7q5JRh_VnsKNqEDBl-60KruafC7fGfw",
            authDomain: "app-ip-line.firebaseapp.com",
            projectId: "app-ip-line",
            storageBucket: "app-ip-line.firebasestorage.app",
            messagingSenderId: "697728554662",
            appId: "1:697728554662:web:73b67252752e97051c4667",
            measurementId: "G-9YQ4CMNEW1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ตัวแปรเก็บข้อมูลเครื่องเพื่อเตรียมส่ง
        let systemInfo = {
            ip: "กำลังดึงข้อมูล...",
            os: "ไม่ทราบระบบปฏิบัติการ",
            device: window.navigator.userAgent
        };

        function getOS() {
            const userAgent = window.navigator.userAgent;
            if (userAgent.indexOf("Win") !== -1) return "Windows";
            if (userAgent.indexOf("Mac") !== -1) return "MacOS";
            if (userAgent.indexOf("X11") !== -1 || userAgent.indexOf("Linux") !== -1) return "Linux";
            if (userAgent.indexOf("Android") !== -1) return "Android";
            if (userAgent.indexOf("like Mac") !== -1) return "iOS (iPhone/iPad)";
            return "ไม่ทราบระบบปฏิบัติการ";
        }

        // ฟังก์ชันทำงานตอนโหลดหน้าเว็บ (แค่แสดงผล ยังไม่เซฟลงฐานข้อมูล)
        async function loadSystemInfo() {
            systemInfo.os = getOS();
            document.getElementById("osDisplay").innerText = systemInfo.os;
            document.getElementById("deviceDisplay").innerText = systemInfo.device;

            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                systemInfo.ip = data.ip;
                document.getElementById("ipDisplay").innerText = systemInfo.ip;
                document.getElementById("status").innerText = "ระบบพร้อมใช้งาน กรุณากรอกข้อมูลและกดบันทึก";
            } catch (error) {
                console.error("ดึง IP ไม่สำเร็จ:", error);
                document.getElementById("ipDisplay").innerText = "ดึงข้อมูลล้มเหลว";
            }
        }

        // ฟังก์ชันทำงานเมื่อกดปุ่ม "บันทึก"
        async function saveDataToFirebase() {
            const statusText = document.getElementById("status");
            const btn = document.getElementById("saveBtn");
            
            // ดึงค่าจากช่องที่ผู้ใช้กรอก
            const nameVal = document.getElementById("nameInput").value.trim();
            const emailVal = document.getElementById("emailInput").value.trim();
            const phoneVal = document.getElementById("phoneInput").value.trim();

            // เช็คว่ากรอกข้อมูลหรือยัง (ถ้าอยากบังคับให้กรอก)
            if (!nameVal || !emailVal || !phoneVal) {
                statusText.className = "error";
                statusText.innerText = "กรุณากรอกข้อมูลให้ครบถ้วนก่อนบันทึกนะเจี๊ยก!";
                return;
            }

            try {
                btn.disabled = true; // ป้องกันการกดเบิ้ล
                statusText.className = "";
                statusText.style.color = "blue";
                statusText.innerText = "กำลังบันทึกข้อมูล...";

                // ส่งข้อมูลทั้งหมดขึ้น Firestore
                await addDoc(collection(db, "visitor_ips"), {
                    account_name: nameVal,
                    email: emailVal,
                    phone: phoneVal,
                    ip_address: systemInfo.ip,
                    os: systemInfo.os,
                    device_info: systemInfo.device,
                    timestamp: new Date()
                });

                statusText.className = "success";
                statusText.innerText = "บันทึกข้อมูลเข้าระบบเรียบร้อยแล้ว!";
                
                // ล้างช่องกรอกข้อมูล
                document.getElementById("nameInput").value = "";
                document.getElementById("emailInput").value = "";
                document.getElementById("phoneInput").value = "";

            } catch (error) {
                console.error("Error:", error);
                statusText.className = "error";
                statusText.innerText = "เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล";
            } finally {
                btn.disabled = false;
            }
        }

        // โหลดข้อมูลเครื่องทันทีที่เปิดเว็บ
        window.onload = loadSystemInfo;

        // ผูกฟังก์ชัน saveDataToFirebase เข้ากับปุ่มบันทึก
        document.getElementById("saveBtn").addEventListener("click", saveDataToFirebase);
    </script>
</body>
</html>
