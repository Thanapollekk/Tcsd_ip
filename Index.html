<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบชวนเพื่อนเข้า LIFF</title>
    <!-- โหลด LIFF SDK เจี๊ยก เจี๊ยก -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #f4f4f4;}
        button { padding: 15px 30px; font-size: 18px; background-color: #06C755; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;}
        button:hover { background-color: #05A546; }
    </style>
</head>
<body>

    <h1>ยินดีต้อนรับสู่แกรนด์ไลน์! เจี๊ยก เจี๊ยก</h1>
    <p>กดปุ่มด้านล่างเพื่อชวนเพื่อนเลย</p>
    <!-- ซ่อนปุ่มไว้ก่อน จะแสดงเมื่อล็อกอินเสร็จ เจี๊ยก เจี๊ยก -->
    <button id="shareButton" style="display: none;">ส่งลิงก์ชวนเพื่อน</button>

    <script>
        // เอา LIFF ID ที่คัดลอกมาใส่ตรงนี้ เจี๊ยก เจี๊ยก
        const myLiffId = "ใส่_LIFF_ID_ของคุณที่นี่";

        async function initializeLiff() {
            try {
                await liff.init({ liffId: myLiffId });
                
                // ตรวจสอบว่าล็อกอินหรือยัง เจี๊ยก เจี๊ยก
                if (!liff.isLoggedIn()) {
                    liff.login(); // ถ้ายังไม่ล็อกอิน ให้ระบบพาไปหน้าล็อกอินของ LINE
                } else {
                    // ถ้าล็อกอินแล้ว ให้แสดงปุ่มแชร์ขึ้นมา เจี๊ยก เจี๊ยก
                    document.getElementById("shareButton").style.display = "inline-block";
                }
            } catch (err) {
                console.error("ระบบ LIFF เกิดข้อผิดพลาด ", err);
            }
        }

        // ฟังก์ชันสำหรับเปิดหน้าต่างเลือกเพื่อน เจี๊ยก เจี๊ยก
        async function shareMessage() {
            if (liff.isApiAvailable('shareTargetPicker')) {
                try {
                    const res = await liff.shareTargetPicker([
                        {
                            type: "text",
                            text: "เข้ามาร่วมกลุ่มโจรสลัดกับเราสิ! ลองกดเลย https://liff.line.me/" + myLiffId
                        }
                    ]);
                    
                    if (res) {
                        alert("ส่งข้อความให้เพื่อนเรียบร้อย เจี๊ยก เจี๊ยก!");
                    } else {
                        console.log("ผู้ใช้ปิดหน้าต่าง ยกเลิกการส่งข้อความ เจี๊ยก เจี๊ยก");
                    }
                } catch (error) {
                    console.error("เกิดข้อผิดพลาดในการแชร์ เจี๊ยก เจี๊ยก", error);
                }
            } else {
                alert("อุปกรณ์นี้ไม่รองรับ Share Target Picker เจี๊ยก เจี๊ยก");
            }
        }

        // ผูกปุ่มเข้ากับฟังก์ชันแชร์ข้อความ
        document.getElementById("shareButton").addEventListener("click", shareMessage);

        // สั่งให้ระบบเริ่มทำงาน
        initializeLiff();
    </script>
</body>
</html>
