<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แสดงรูปภาพเป้าหมาย</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #2c3e50;
        }
        .image-container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="image-container">
        <!-- รูปภาพจะถูกดึงจาก URL แบบ Raw ของ GitHub เจี๊ยก เจี๊ยก -->
        <img src="https://raw.githubusercontent.com/Thanapollekk/Tcsd_ip/main/iStock-997048534.jpg" alt="รูปภาพหลักฐาน">
    </div>

</body>
</html>
