<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึก IP Address ลง Firestore</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #status { color: blue; font-weight: bold; }
        .success { color: green !important; }
        .error { color: red !important; }
    </style>
</head>
<body>
    <h2>ระบบบันทึก IP Address อัตโนมัติ</h2>
    <p>ระบบกำลังตรวจสอบและบันทึก IP ของคุณลงฐานข้อมูล...</p>
    
    <p id="status">กำลังดำเนินการ...</p>
    <p id="ipDisplay"></p> <!-- ไว้แสดง IP บนหน้าจอ -->

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        // Config ของคุณ (ผมคงค่าเดิมไว้ให้เจี๊ยก เจี๊ยก)
        const firebaseConfig = {
            apiKey: "AIzaSyAv7q5JRh_VnsKNqEDBl-60KruafC7fGfw",
            authDomain: "app-ip-line.firebaseapp.com",
            projectId: "app-ip-line",
            storageBucket: "app-ip-line.firebasestorage.app",
            messagingSenderId: "697728554662",
            appId: "1:697728554662:web:73b67252752e97051c4667",
            measurementId: "G-9YQ4CMNEW1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const statusText = document.getElementById("status");
        const ipDisplay = document.getElementById("ipDisplay");

        // ฟังก์ชันสำหรับดึง IP และบันทึกลง Firebase
        async function fetchIpAndSave() {
            try {
                // 1. ดึง IP Address จาก ipify API
                statusText.innerText = "กำลังดึงข้อมูล IP Address...";
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                const userIp = data.ip;

                // แสดง IP บนหน้าเว็บให้ผู้ใช้เห็น
                ipDisplay.innerText = `IP ของคุณคือ: ${userIp}`;
                statusText.innerText = "กำลังบันทึกลงฐานข้อมูล...";

                // 2. บันทึก IP ลง Firestore ในคอลเล็กชันชื่อ "visitor_ips"
                const docRef = await addDoc(collection(db, "visitor_ips"), {
                    ip_address: userIp,
                    timestamp: new Date() // บันทึกเวลาด้วย
                });

                // 3. แจ้งผลสำเร็จ
                statusText.className = "success";
                statusText.innerText = `บันทึก IP สำเร็จ! (อ้างอิง: ${docRef.id})`;

            } catch (error) {
                // จัดการ Error (เช่น เน็ตหลุด หรือ API มีปัญหา)
                console.error("เกิดข้อผิดพลาด: ", error);
                statusText.className = "error";
                statusText.innerText = "เกิดข้อผิดพลาด ไม่สามารถดึงหรือบันทึก IP ได้ กรุณาดู Console";
            }
        }

        // เรียกใช้งานฟังก์ชันทันทีที่หน้าเว็บโหลดเสร็จ
        window.onload = fetchIpAndSave;

    </script>
</body>
</html>
