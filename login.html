<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Login</title>
    <style>
        /* ตั้งค่าพื้นหลังสีดำและฟอนต์พิมพ์ดีดแบบ Terminal */
        body {
            background-color: #000000;
            color: #00FF00;
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            font-size: 16px;
            line-height: 1.5;
        }

        /* เอาขอบของ Input ออกและทำให้พื้นหลังโปร่งใส */
        input {
            background-color: transparent;
            border: none;
            color: #00FF00;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 16px;
            outline: none;
            width: 250px;
        }

        /* เว้นระยะห่างของรหัสผ่านตอนพิมพ์ */
        input[type="password"] {
            letter-spacing: 3px;
        }

        /* ปรับแต่งปุ่มให้ดูเหมือนข้อความที่กดได้ */
        .terminal-btn {
            background-color: transparent;
            border: none;
            color: #00FF00;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 5px;
            margin-top: 15px;
            text-decoration: underline;
        }

        /* เวลาเอาเมาส์ชี้ให้สลับสี (Invert) เหมือนการลากคลุมข้อความ */
        .terminal-btn:hover {
            background-color: #00FF00;
            color: #000000;
            text-decoration: none;
        }

        .system-text {
            margin-bottom: 20px;
        }

        .input-line {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .prompt {
            margin-right: 10px;
        }

        /* ข้อความแจ้งเตือนสีแดงเวลารหัสผิด */
        #errorMsg {
            color: #FF0000;
            margin-top: 15px;
            display: none;
        }
        
        /* กระพริบ Cursor เล็กน้อย (ถ้าผู้ใช้ไม่ได้โฟกัส Input) */
        .cursor-blink {
            animation: blinker 1s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="system-text">
        Microsoft Windows [Version 10.0.19045.2965]<br>
        (c) Microsoft Corporation. All rights reserved.<br><br>
        C:\System32&gt; run login.exe<br>
        Initializing secure connection... OK.
    </div>

    <div id="loginForm">
        <div class="input-line">
            <span class="prompt">Username:</span>
            <!-- autofocus เพื่อให้เคอร์เซอร์มาอยู่ที่ช่องนี้ทันทีที่เปิดเว็บ -->
            <input type="text" id="username" autocomplete="off" autofocus>
        </div>
        
        <div class="input-line">
            <span class="prompt">Password:</span>
            <input type="password" id="password">
        </div>
        
        <div>
            <button class="terminal-btn" onclick="checkLogin()">[ Execute Login ]</button>
        </div>

        <div id="errorMsg">
            C:\System32&gt; ERROR: Access Denied. Invalid Credentials.
        </div>
    </div>

    <script>
        function checkLogin() {
            const validUser = "monkeydluffy";
            const validPass = ",y'f'hnuu";

            const inputUser = document.getElementById("username").value;
            const inputPass = document.getElementById("password").value;
            const errorText = document.getElementById("errorMsg");

            if (inputUser === validUser && inputPass === validPass) {
                errorText.style.display = "none";
                // พิมพ์ข้อความสีเขียวแจ้งว่าเข้าสู่ระบบสำเร็จก่อนเปลี่ยนหน้า
                document.body.innerHTML += "<br>C:\\System32&gt; Access Granted. Redirecting...<span class='cursor-blink'>_</span>";
                setTimeout(() => {
                    window.location.href = "index.html"; 
                }, 800); // ดีเลย์ 0.8 วินาทีให้ดูเท่ๆ
            } else {
                errorText.style.display = "block";
                // ล้างช่องรหัสผ่านให้กรอกใหม่
                document.getElementById("password").value = ""; 
                document.getElementById("password").focus();
            }
        }

        // เพิ่มฟังก์ชันให้กดปุ่ม Enter บนคีย์บอร์ดแล้วล็อกอินได้เลย
        document.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                checkLogin();
            }
        });
    </script>

</body>
</html>
